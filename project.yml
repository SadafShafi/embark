# Fallback project definition for XcodeGen, for Xcode versions older than 16
# (the checked-in .xcodeproj uses file-system synchronised groups, which Xcode 16
# introduced). Run `xcodegen generate` to rebuild Emberdeck.xcodeproj from this.
name: Emberdeck
options:
  bundleIdPrefix: com.emberdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Emberdeck:
    type: application
    platform: iOS
    sources:
      - path: Emberdeck
    info:
      path: Emberdeck-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emberdeck.Emberdeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Emberdeck.entitlements
    dependencies:
      - target: EmberdeckWidgetExtension
        embed: true
  EmberdeckWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EmberdeckWidget
    info:
      path: EmberdeckWidget-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emberdeck.Emberdeck.widget
        CODE_SIGN_ENTITLEMENTS: EmberdeckWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
